name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tapo:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tapo
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets --features rnet-tapo/debug,rnet-tapo/bluetooth -- -D warnings
      - run: cargo test --features rnet-tapo/debug,rnet-tapo/bluetooth

  tapo-python:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tapo/rnet-tapo-py
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --group dev --locked
      - run: uv run --locked maturin develop
      - run: uv run --locked mypy python

  mercusys:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mercusys
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - run: uv run --locked pytest tests/test_tpap.py tests/test_tsReader.py

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - run: npx next build
