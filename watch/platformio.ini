; roomnet's firmware for the LilyGO T-Watch S3.
; Board support is in lib/LilyGoLib, copied from LilyGO's TTGO_TWatch_Library
; (branch t-watch-s3, commit 9884d62).

[platformio]
default_envs = twatch-s3
boards_dir = boards

[env:twatch-s3]
platform = espressif32@6.3.0
framework = arduino
board = LilyGoWatch-S3
board_build.filesystem = fatfs
board_build.partitions = app3M_fat9M_16MB.csv
; The watch drops the connection when esptool switches to 921600.
upload_speed = 115200
monitor_speed = 115200

build_flags =
    ; Serial over USB. Startup waits for a terminal while USB is plugged in.
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=0
    -DBOARD_HAS_PSRAM
    -DDISABLE_ALL_LIBRARY_WARNINGS
    -include lib/LilyGoLib/Setup212_LilyGo_T_Watch_S3.h
    -DUSER_SETUP_LOADED
    ; The watch's radio is an SX1262; leave the other RadioLib modules out.
    -DRADIOLIB_EXCLUDE_NRF24
    -DRADIOLIB_EXCLUDE_RF69
    -DRADIOLIB_EXCLUDE_SX1231
    -DRADIOLIB_EXCLUDE_SI443X
    -DRADIOLIB_EXCLUDE_RFM2X
    -DRADIOLIB_EXCLUDE_SX127X
    -DRADIOLIB_EXCLUDE_AFSK
    -DRADIOLIB_EXCLUDE_AX25
    -DRADIOLIB_EXCLUDE_HELLSCHREIBER
    -DRADIOLIB_EXCLUDE_MORSE
    -DRADIOLIB_EXCLUDE_RTTY
    -DRADIOLIB_EXCLUDE_SSTV
    -DRADIOLIB_EXCLUDE_DIRECT_RECEIVE
    -DRADIOLIB_EXCLUDE_APRS
    -DRADIOLIB_EXCLUDE_BELL

lib_deps =
    bodmer/TFT_eSPI @ 2.5.43
    lvgl/lvgl @ 8.4.0
    jgromes/RadioLib @ 7.1.0
    lewisxhe/XPowersLib @ 0.2.4
    lewisxhe/SensorLib @ 0.1.8
    bblanchon/ArduinoJson @ 7.2.1
